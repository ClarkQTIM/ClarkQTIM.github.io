- id: cervical-conformal-mc
  publication_date: "2024-10-03"
  title: "Conformal Prediction and Monte Carlo Inference for Addressing Uncertainty in Cervical Cancer Screening"
  year: 2025
  first_online: "2024-10-03"
  type: "Conference Paper"
  first_author: true
  status: "Published"

  authors:
    - "Clark C"
    - "Kinder S"
    - "Egemen D"
    - "Befano B"
    - "Desai K"
    - "Ahmed SR"
    - "Singh P"
    - "Rodriguez AC"
    - "Jeronimo J"
    - "De Sanjose S"
    - "Wentzensen N"
    - "Schiffman M"
    - "Kalpathy-Cramer J"

  venue: "UNSURE 2024 / Lecture Notes in Computer Science"
  volume: "15167"
  pages: "205-214"
  publisher: "Springer"

  doi: "10.1007/978-3-031-73158-7_19"
  publication_url: "https://link.springer.com/chapter/10.1007/978-3-031-73158-7_19"
  project_url: "/research/cervical/conformal-prediction/"

  citation: >-
    Clark C, Kinder S, Egemen D, Befano B, Desai K,
    Ahmed SR, Singh P, Rodriguez AC, Jeronimo J,
    De Sanjose S, Wentzensen N, Schiffman M,
    Kalpathy-Cramer J. Conformal prediction and Monte
    Carlo inference for addressing uncertainty in
    cervical cancer screening. In: Sudre CH, Mehta R,
    Ouyang C, Qin C, Rakic M, Wells WM, editors.
    Uncertainty for Safe Utilization of Machine Learning
    in Medical Imaging: UNSURE 2024. Cham: Springer;
    2025. p. 205-214. (Lecture Notes in Computer Science;
    vol. 15167). doi:10.1007/978-3-031-73158-7_19.

  abstract: >-
    In the medical domain, where a misdiagnosis can have
    life-altering ramifications, understanding the certainty
    of model predictions is an important part of the model
    development process. However, deep learning approaches
    suffer from a lack of a native uncertainty metric found
    in other statistical learning methods. One common
    technique for uncertainty estimation is the use of
    Monte-Carlo (MC) dropout at training and inference.
    Another approach is Conformal Prediction for Uncertainty
    Quantification (CUQ). This paper will explore these two
    methods as applied to a cervical cancer screening
    algorithm currently under development for use in
    low-resource settings. We find that overall, CUQ and
    MC inference produce similar uncertainty patterns, that
    CUQ can aid in model development through class
    delineation, and that CUQ uncertainty is higher when
    the model is incorrect, providing further fine-grained
    information for clinical decisions.

- id: acetowhite-temporal
  publication_date: "2025-11-12"
  title: "Automating the Detection of Acetowhite Lesions by Classifying the Temporal Behavior of Cervical Regions"
  year: 2026
  first_online: "2025-11-12"
  type: "Journal Article"
  first_author: true
  status: "Published"

  authors:
    - "Clark C"
    - "Aquilina A"
    - "Perkins RB"
    - "Papagiannakis E"
    - "Kalpathy-Cramer J"

  venue: "Journal of Lower Genital Tract Disease"
  volume: "30"
  issue: "1"
  pages: "31-38"

  doi: "10.1097/LGT.0000000000000927"
  pmid: "41222472"
  publication_url: "https://doi.org/10.1097/LGT.0000000000000927"
  project_url: "/research/cervical/acetowhitening/"

  citation: >-
    Clark C, Aquilina A, Perkins RB, Papagiannakis E,
    Kalpathy-Cramer J. Automating the detection of
    acetowhite lesions by classifying the temporal
    behavior of cervical regions. J Low Genit Tract Dis.
    2026 Jan 1;30(1):31-38.
    doi:10.1097/LGT.0000000000000927.

  abstract: >-
    Objective: Cervical acetowhitening is a strong visual
    cue for lesion identification; however, clinician
    opinions are subjective and inconsistent. To provide
    objective evaluation, a machine learning model that
    enhances colposcopy by automating acetowhite lesion
    detection in cervical time-series images was developed.

    Methods: A dataset of time-series images collected
    during 238 colposcopy examinations, where in each case,
    acetowhitening areas had been annotated by 5 expert
    colposcopists, was utilized. After preprocessing the
    images, which included aligning them and extracting
    the cervix by bounding-box detection, the time-series
    images were divided into discrete segments, and the
    transient visual changes were extracted as local
    statistical features. Using the local agreement levels
    of the reviewers' predictions for the presence of a
    lesion, a machine learning model was trained to classify
    the time-series data and generate synthetic annotations.

    Results: The model-generated synthetic acetowhite
    lesion maps aligned well with the experts' annotations.
    In a subset of cases with localized histology results
    from punch biopsy, model predictions correlated well
    with histopathology, highlighting potential for clinical
    utility.

    Conclusions: The proposed method was effective in
    mimicking expert colposcopists in identifying lesions
    based on classification of time-series images and
    outputs correlated with histology. Application of a
    machine learning model in the clinical setting may
    streamline lesion identification, support clinician
    decision-making for punch biopsy, and eventually improve
    accuracy in detecting precancerous lesions.

- id: uat-medsam
  publication_date: "2026-02-17"
  title: "Uncertainty-Aware Training for Ophthalmic Segmentation Using MedSAM"
  year: 2026
  first_online: "2026-02-17"
  type: "Journal Article"
  first_author: true
  status: "Published"

  authors:
    - "Clark CW"
    - "Kinder S"
    - "Nebbia G"
    - "Veturi YA"
    - "McNamara S"
    - "Manoharan N"
    - "Forest T"
    - "Kahook M"
    - "Mandava N"
    - "Singh P"
    - "Kalpathy-Cramer J"

  venue: "Translational Vision Science & Technology"
  volume: "15"
  issue: "2"
  article_number: "19"

  doi: "10.1167/tvst.15.2.19"
  pmid: "41700793"
  publication_url: "https://tvst.arvojournals.org/article.aspx?articleid=2811497"
  project_url: "/research/ophthalmology/uat/"

  citation: >-
    Clark CW, Kinder S, Nebbia G, Veturi YA, McNamara S,
    Manoharan N, Forest T, Kahook M, Mandava N, Singh P,
    Kalpathy-Cramer J. Uncertainty-aware training for
    ophthalmic segmentation using MedSAM.
    Transl Vis Sci Technol. 2026 Feb;15(2):19.
    doi:10.1167/tvst.15.2.19.

  abstract: >-
    Purpose: Uncertainty quantification (UQ) has been
    applied to deep learning (DL) models to enhance not
    only their interpretability, but to guide model learning.
    This work presents Uncertainty-Aware Training (UAT),
    which generates uncertainty maps at train time and
    augments the loss function with them to allow the
    models to concentrate on areas of high uncertainty
    during learning. By highlighting uncertain pixels
    as requiring more scrutiny, model performance is
    enhanced on three ophthalmic segmentation tasks.

    Methods: We applied UAT to three ophthalmic
    segmentation, or pixel-level classification, tasks:
    geographic atrophy (GA), optic cup (OC), and foveal
    avascular zone (FAZ). UAT weighs the loss function
    binary cross-entropy according to uncertainty,
    forcing the model to focus on ambiguous areas.
    We experimented with output-based UQ methods,
    such as entropy, and post-hoc techniques like
    conformal prediction. UAT was evaluated on a
    state-of-the-art foundational model fine-tuned
    for these specific segmentation tasks.

    Results: The addition of an entropy-weighing map
    at loss calculation time consistently improved
    model performance across all three datasets,
    with conformal prediction using the Least Ambiguous
    Set-Valued Classifier version also achieving higher
    overall performance for GA and OC segmentation.
    The easy-to-integrate implementation of UAT
    proved feasible without significant training
    structure modifications.

    Conclusions: UAT enhances DL model performance
    and interpretability by focusing on uncertainty
    in addition to error, improving segmentation accuracy.

    Translational Relevance: UAT uses interpretable
    uncertainty maps to enhance DL segmentation
    performance. Its lightweight integration makes it
    practical for adoption and leads to improved
    model performance on ophthalmic segmentation tasks.
